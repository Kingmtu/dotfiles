# colors for foot terminal
# You can use this template by adding the following to wallust.toml:
# foot = { template = "foot.ini", target = "~/.config/foot/colors.ini" }
# and add the following to your foot.ini config
#
# [main]
# include=/home/USERNAME/.config/foot/colors.ini


[colors]
background=1B1F1D
foreground=FCF1E8

# Normal/regular colors (color palette 0-7)
regular0=454A48  # black
regular1=7F8D72  # red
regular2=918563  # green
regular3=AD8051  # yellow
regular4=878967  # blue
regular5=A78149  # magenta
regular6=B9A28D  # cyan
regular7=F3E3D5  # white

# Bright colors (color palette 8-15)
bright0=AA9F95   # bright black
bright1=789061   # bright red
bright2=9F8D55   # bright green
bright3=CD8437   # bright yellow
bright4=A2A673   # bright blue
bright5=D8A454   # bright magenta
bright6=F7D8BC   # bright cyan
bright7=F3E3D5   # bright white

# selection-foreground=<inverse foreground/background>
# selection-background=<inverse foreground/background>
# urls=<regular3>
