# colors for foot terminal
# You can use this template by adding the following to wallust.toml:
# foot = { template = "foot.ini", target = "~/.config/foot/colors.ini" }
# and add the following to your foot.ini config
#
# [main]
# include=/home/USERNAME/.config/foot/colors.ini


[colors]
background=0F1111
foreground=C1E5E6

# Normal/regular colors (color palette 0-7)
regular0=3A3B3C  # black
regular1=414A4A  # red
regular2=5E8280  # green
regular3=5F8885  # yellow
regular4=6C8483  # blue
regular5=588A8A  # magenta
regular6=3B888A  # cyan
regular7=9ED1D3  # white

# Bright colors (color palette 8-15)
bright0=6F9394   # bright black
bright1=434F4F   # bright red
bright2=528B86   # bright green
bright3=408781   # bright yellow
bright4=638B8A   # bright blue
bright5=439494   # bright magenta
bright6=4EB5B8   # bright cyan
bright7=9ED1D3   # bright white

# selection-foreground=<inverse foreground/background>
# selection-background=<inverse foreground/background>
# urls=<regular3>
